[behave]
# Behave Configuration File
# Documentation: https://behave.readthedocs.io/en/latest/behave.html#configuration-files

# Output format
# Options: pretty, plain, json, junit, html
format = pretty
show_timings = true
show_skipped = true

# Color output
color = true

# Logging
logging_level = WARNING
logging_format = %(levelname)s:%(name)s:%(message)s
logging_clear_handlers = true
logging_filter = -requests

# Stop on first failure (useful for debugging)
# stop = true

# Dry run (check syntax without executing)
# dry_run = true

# Paths
paths = src/tests/features
# paths = features/

# Default tags (exclude WIP and skip)
# tags = -wip,-skip

# JUnit output
# junit = true
# junit_directory = reports/

# Summary
summary = true
snippets = true

# Show source location in output
show_source = true

# Default language
lang = en

# Scenario outline expand (show all examples)
expand = false

# Quiet mode (minimal output)
# quiet = true

# Verbose mode (detailed output)
# verbose = true

# Step timing threshold (warn if step takes longer)
# step_timeout = 60

# Default scenarios to run (can override with CLI)
# default_tags = @smoke

# Output encoding
# stdout_encoding = UTF-8

# Exclude patterns
# exclude_patterns = *.bak,*~
